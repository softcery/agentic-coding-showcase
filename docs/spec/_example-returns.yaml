# Product domain. Same eight keys as a technical domain, same folder.
# Rules carry the business rule. Acceptance lives in the task document.
# Domain matches the file stem. A scaffold file, prefix _, is exempt.

domain: returns

purpose: File one period return that states the figures the holder sends to the authority.

scope: The returns system reads the booking history and the licence configuration. It writes the return figures, the locked snapshot and the discrepancy flags.

design:
  - part: Return figures
    does: One action folds the booking history to the period. The fold gives the booked figure and the departed figure.
  - part: Lock-in
    does: The holder confirms the filed figures. The system stores an immutable snapshot with a timestamp and the actor.
  - part: Discrepancy detection
    does: A change to a locked period compares against the snapshot. Each flag names the booking, the delta and the basis it breaks.

rules:
  - id: R1
    text: A return carries the booked basis and the departed basis together.
  - id: R2
    text: Cadence derives from the licence type and the turnover. The holder does not select it.
  - id: R3
    text: A locked snapshot is immutable. A correction supersedes it and keeps the old one.
  - id: R4
    text: The system prepares the figures. A person files them.

limits:
  - The authority has no submission interface. A person types the figures into the portal.
  - The return grain is one holder total. A split by booking type is not built.

issues:
  - text: The forward breakdown counts an in-period departure twice. 1 of 14 test periods fails.
    evidence: docs/notes/_example-evidence.md

references: {}
